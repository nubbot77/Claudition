<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <script>
      // apply the saved theme before first paint (same rule as lib/theme.tsx)
      try {
        var t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("claudition-theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23111111'/%3E%3Cpath d='M8.5 18V7.25C8.5 6.56 9.06 6 9.75 6h4.5c.69 0 1.25.56 1.25 1.25V18' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M6 18h12' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='13.25' cy='12.5' r='.95' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Claudition</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
